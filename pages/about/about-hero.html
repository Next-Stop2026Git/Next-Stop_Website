<!-- pages/about/hero.html-->
<section class="about-hero" aria-label="Sobre Nosotros">
  <div class="about-hero__bg-glow" aria-hidden="true"></div>
  <div class="about-hero__container container">

    <!-- Columna Izquierda: Texto (Hereda de typography.css) -->
    <div class="about-hero__text-column">
      <div class="eyebrow">
        Descubre
      </div>

      <h1>
        Conectando fronteras, <br />
        <span class="text-gradient">entregando confianza.</span>
      </h1>

      <p>
        Más que una agencia de paquetería, somos tu aliado logístico.
        Simplificamos tus compras en Estados Unidos y aseguramos que cada
        paquete llegue a tus manos en Nicaragua sin complicaciones.
      </p>
    </div>

    <!-- Columna Derecha: Collage Vertical Asimétrico (4 Imágenes) -->
    <div class="about-hero__visual-column">
      <div class="visual-slice slice-1">
        <div class="slice-overlay"></div>
        <img src="/assets/images/Operaciones en Bodega.png" alt="Operaciones en Bodega" />
      </div>
      <div class="visual-slice slice-2">
        <div class="slice-overlay"></div>
        <img src="/assets/images/Logística Marítima y Aérea.png" alt="Logística Marítima y Aérea" />
      </div>
      <div class="visual-slice slice-3">
        <div class="slice-overlay"></div>
        <img src="/assets/images/Entregas en Nicaragua.jpg" alt="Entregas en Nicaragua" />
      </div>
      <div class="visual-slice slice-4">
        <div class="slice-overlay"></div>
        <img src="/assets/images/Entrega final al cliente.png" alt="Entrega final al cliente" />
      </div>
    </div>
  </div>

  <!-- Indicador de Scroll Animado -->
  <div class="about-hero__scroll">
    <span class="eyebrow">Sigue explorando</span>
    <div class="scroll-mouse">
      <div class="scroll-wheel"></div>
    </div>
  </div>
</section>
