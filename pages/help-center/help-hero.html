<!-- ============================================
     HERO: CENTRO DE GUÍA
     ============================================ -->
<section class="guide-hero">
  <!-- Fondo -->
  <div class="guide-hero__bg" aria-hidden="true">
    <img src="/assets/background/hero-img.png" alt="Fondo guía" class="guide-hero__img" />
  </div>
  <div class="guide-hero__content container">
    
    <!-- Columna Izquierda: Texto y Enlaces Rápidos -->
    <div class="guide-hero__text-column fade-in-up" style="--delay: 100ms">
      <div class="guide-hero__badge">
        <svg class="badge-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
        <span>Centro de Ayuda</span>
      </div>
      
      <h1 class="guide-hero__title">
        Tu guía paso a paso para <span class="text-highlight">compras exitosas</span>
      </h1>
      
      <p class="guide-hero__subtitle">
        Descubre cómo realizar tus compras y envíos de manera segura y eficiente.
      </p>

      <!-- Botones de salto rápido a las secciones -->
      <div class="guide-hero__anchors fade-in-up" style="--delay: 300ms">
        <a href="#tutorial" class="anchor-pill">
          <svg class="anchor-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <span>Video Tutorial</span>
        </a>
        
        <a href="#productos" class="anchor-pill">
          <svg class="anchor-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line>
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span>Guía de Productos</span>
        </a>
      </div>
    </div>

    <!-- Columna Derecha: Tarjeta UI de Estado -->
    <div class="guide-hero__visual-column fade-in-up" style="--delay: 500ms">
      <div class="support-glass-card floating-anim">
        <div class="support-card-header">
          <div class="support-icon-wrapper">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          </div>
          <div class="support-text">
            <h3>¿Primera vez comprando?</h3>
            <p>Flujo recomendado de 4 pasos</p>
          </div>
        </div>
        
        <div class="support-steps-mini">
          <div class="step-mini">
            <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>Tienda</span>
          </div>
          <div class="step-mini">
            <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>Prepara tu carrito</span>
          </div>
          <div class="step-mini">
            <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>Dirección</span>
          </div>
          <div class="step-mini">
            <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>Pago</span>
          </div>
        </div>

        <!-- Badges de plataformas -->
        <div class="floating-brand brand--amazon" aria-hidden="true">
          <span class="brand-dot"></span> Amazon
        </div>
        <div class="floating-brand brand--shein" aria-hidden="true">
          <span class="brand-dot"></span> Shein
        </div>
      </div>
    </div>

  </div>
</section>
